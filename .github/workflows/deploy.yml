name: deploy
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy chat --project-ref kvbydxzdnhuszjgckish --use-api
        working-directory: compagnon
      - run: supabase functions deploy tts --project-ref kvbydxzdnhuszjgckish --use-api
        working-directory: compagnon
